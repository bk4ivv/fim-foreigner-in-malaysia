name: Build FIM test APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK for device testing
        run: flutter build apk --debug

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version_name=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          build_number=$(sed -n 's/^version: [^+]*+\(.*\)/\1/p' pubspec.yaml)
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Rename APK with app version and build number
        run: cp build/app/outputs/flutter-apk/app-debug.apk FIM-Foreigner-in-Malaysia-v${{ steps.app_version.outputs.version_name }}-build${{ steps.app_version.outputs.build_number }}-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIM-Foreigner-in-Malaysia-v${{ steps.app_version.outputs.version_name }}-build${{ steps.app_version.outputs.build_number }}-test
          path: FIM-Foreigner-in-Malaysia-v${{ steps.app_version.outputs.version_name }}-build${{ steps.app_version.outputs.build_number }}-test.apk
          if-no-files-found: error
